<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>신한라이프 오늘의 운세 (1978.12.07 전용)</title>

  <!-- 안드로이드 크롬 '홈 화면에 추가 / 앱 설치' 활성화를 위한 PWA Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"1978.12.07 전용 신한운세","short_name":"오늘의운세","start_url":"./index.html","display":"standalone","background_color":"#f8fafc","theme_color":"#0f172a"}' />

  <style>
    :root {
      --primary: #0046ff;
      --primary-dark: #0033cc;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent-bg: #eff6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 48px;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* 상단 헤더 (사주 고정 프로필) */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 24px 20px 20px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: #93c5fd;
    }

    .sync-badge.ok {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }

    .sync-badge.err {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .profile-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .profile-sub {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 14px;
    }

    /* 사주원국 4기둥 요약 바 */
    .pillars-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .pillar-item {
      font-size: 12px;
      color: #94a3b8;
    }

    .pillar-item strong {
      display: block;
      font-size: 15px;
      color: #ffffff;
      margin-top: 2px;
    }

    /* 오늘 / 내일 전환 탭 */
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 16px 0;
      background: #e2e8f0;
      padding: 5px;
      border-radius: 14px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* 메인 컨텐츠 영역 */
    main {
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .date-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .date-label {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .updated-time {
      font-size: 11px;
      color: var(--muted);
    }

    /* 총점 및 행운의 색 요약 그리드 */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: var(--accent-bg);
      border: 1px solid #dbeafe;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .metric-label {
      font-size: 12px;
      font-weight: 600;
      color: #3b82f6;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 800;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.15);
      display: inline-block;
    }

    /* 신한라이프 총평 본문 */
    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fortune-paragraph {
      font-size: 15px;
      color: #334155;
      line-height: 1.75;
      margin-bottom: 14px;
      word-break: keep-all;
      background: #f8fafc;
      padding: 14px 16px;
      border-radius: 12px;
      border-left: 4px solid var(--primary);
    }

    .fortune-paragraph:last-child {
      margin-bottom: 0;
    }

    /* 원문 전체보기 (Raw Text) 토글 */
    details.raw-viewer {
      margin-top: 14px;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
    }

    details.raw-viewer summary {
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }

    .raw-pre {
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      color: #334155;
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      max-height: 360px;
      overflow-y: auto;
    }

    /* 에러 또는 빈 데이터 안내 박스 */
    .status-box {
      text-align: center;
      padding: 28px 16px;
    }

    .status-box h3 {
      font-size: 16px;
      color: #dc2626;
      margin-bottom: 8px;
    }

    .status-box p {
      font-size: 13.5px;
      color: #475569;
      margin-bottom: 14px;
    }

    .direct-link-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 상단 고정 프로필 헤더 -->
    <header>
      <div class="header-top">
        <span id="sync-badge" class="sync-badge">데이터 확인 중...</span>
        <button class="refresh-btn" onclick="fetchFortuneJson()">↻ 새로고침</button>
      </div>
      <div class="profile-title">1978년 12월 7일 (양력) 오전 8시</div>
      <div class="profile-sub">신한라이프 정통운세 실제 데이터 연동 전용</div>

      <div class="pillars-bar">
        <div class="pillar-item">시주(진시)<strong>庚辰 (경진)</strong></div>
        <div class="pillar-item">일주(본원)<strong>庚辰 (경진)</strong></div>
        <div class="pillar-item">월주<strong>癸亥 (계해)</strong></div>
        <div class="pillar-item">년주(말띠)<strong>戊午 (무오)</strong></div>
      </div>
    </header>

    <!-- 오늘 / 내일 탭 -->
    <div class="tab-bar">
      <button id="tab-today" class="tab-btn active" onclick="switchTab('today')">오늘의 운세</button>
      <button id="tab-tomorrow" class="tab-btn" onclick="switchTab('tomorrow')">내일의 운세</button>
    </div>

    <!-- 결과 렌더링 영역 -->
    <main id="content-area">
      <div class="card status-box">
        <p>저장소의 <strong>fortune_data.json</strong> 데이터를 불러오는 중입니다...</p>
      </div>
    </main>
  </div>

  <script>
    let fortuneJson = null;
    let currentTab = 'today';

    // 한국어 색상명을 실제 컬러코드로 매핑
    const COLOR_MAP = {
      '빨강': '#ef4444', '적색': '#ef4444', '붉은색': '#ef4444', '홍색': '#f43f5e',
      '파랑': '#3b82f6', '청색': '#2563eb', '푸른색': '#3b82f6', '하늘색': '#38bdf8',
      '노랑': '#eab308', '황색': '#ca8a04', '금색': '#d97706', '주황': '#f97316',
      '초록': '#22c55e', '녹색': '#16a34a', '연두': '#84cc16',
      '보라': '#a855f7', '자주': '#c026d3', '분홍': '#ec4899', '핑크': '#ec4899',
      '검정': '#1e293b', '흑색': '#0f172a', '회색': '#64748b',
      '하양': '#f8fafc', '백색': '#ffffff', '흰색': '#ffffff', '은색': '#cbd5e1',
      '갈색': '#92400e', '베이지': '#d6d3d1', '남색': '#1e3a8a'
    };

    function getColorHex(colorName) {
      if (!colorName) return '#94a3b8';
      for (const [key, hex] of Object.entries(COLOR_MAP)) {
        if (colorName.includes(key)) return hex;
      }
      return '#3b82f6';
    }

    // 1. fortune_data.json 파일만 순수하게 불러오는 함수
    async function fetchFortuneJson() {
      const badge = document.getElementById('sync-badge');
      const contentArea = document.getElementById('content-area');
      badge.className = 'sync-badge';
      badge.innerText = 'JSON 불러오는 중...';

      try {
        const res = await fetch('./fortune_data.json?nocache=' + Date.now());
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} - 저장소에 fortune_data.json 파일이 아직 없거나 경로가 다릅니다.`);
        }

        fortuneJson = await res.json();
        renderDayFortune(currentTab);
      } catch (err) {
        badge.className = 'sync-badge err';
        badge.innerText = '연동 오류';
        contentArea.innerHTML = `
          <div class="card status-box">
            <h3>fortune_data.json 파일을 불러오지 못했습니다</h3>
            <p>${err.message}</p>
            <div class="raw-pre" style="text-align:left;">
1. GitHub 저장소의 [Code] 탭에 fortune_data.json 파일이 index.html과 같은 위치에 있는지 확인해 주세요.
2. 휴대폰에 다운받은 로컬 파일이 아니라 GitHub Pages 주소(https://아이디.github.io/저장소이름/)로 접속해야 JSON 파일을 읽어올 수 있습니다.
            </div>
          </div>
        `;
      }
    }

    // 2. 탭 전환 (오늘 / 내일)
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-today').classList.toggle('active', tab === 'today');
      document.getElementById('tab-tomorrow').classList.toggle('active', tab === 'tomorrow');
      if (fortuneJson) {
        renderDayFortune(tab);
      }
    }

    // 3. 실제 JSON 데이터만 화면에 렌더링 (가짜 문구 일체 없음)
    function renderDayFortune(tab) {
      const badge = document.getElementById('sync-badge');
      const contentArea = document.getElementById('content-area');
      const dayData = tab === 'tomorrow' ? fortuneJson.tomorrow : fortuneJson.today;
      const updatedAt = fortuneJson.updatedAtKST || '시간 정보 없음';

      if (!dayData) {
        badge.className = 'sync-badge err';
        badge.innerText = '데이터 비어있음';
        contentArea.innerHTML = `
          <div class="card status-box">
            <h3>${tab === 'today' ? '오늘' : '내일'} 운세 데이터가 JSON 안에 없습니다</h3>
            <p>fortune_data.json 원본 내용을 아래에서 확인해 주세요.</p>
            <pre class="raw-pre">${JSON.stringify(fortuneJson, null, 2)}</pre>
          </div>
        `;
        return;
      }

      // 파이썬 크롤러가 에러를 기록했거나 본문이 비어있는 경우 진단 화면 표시
      const hasParagraphs = Array.isArray(dayData.paragraphs) && dayData.paragraphs.length > 0;
      const hasRawText = Boolean(dayData.rawText && dayData.rawText.trim().length > 0);

      if (dayData.status === 'error' || (!hasParagraphs && !hasRawText)) {
        badge.className = 'sync-badge err';
        badge.innerText = '신한라이프 본문 미추출';
        contentArea.innerHTML = `
          <div class="card status-box">
            <h3>fortune_data.json은 연결되었으나 운세 본문이 비어 있습니다</h3>
            <p>파이썬(fetch_fortune.py)이 신한라이프 페이지에서 운세 텍스트를 찾지 못했습니다.</p>
            <div class="raw-pre" style="text-align:left;">${JSON.stringify(dayData, null, 2)}</div>
          </div>
        `;
        return;
      }

      // 정상 추출된 경우
      badge.className = 'sync-badge ok';
      badge.innerText = '✓ fortune_data.json 실데이터 연동됨';

      const scoreText = dayData.score ? `${dayData.score}점` : '원문 참조';
      const colorText = dayData.luckyColor ? dayData.luckyColor : '원문 참조';
      const colorHex = getColorHex(dayData.luckyColor);

      const paragraphsHtml = hasParagraphs
        ? dayData.paragraphs.map(p => `<div class="fortune-paragraph">${escapeHtml(p)}</div>`).join('')
        : `<div class="fortune-paragraph">${escapeHtml(dayData.rawText)}</div>`;

      contentArea.innerHTML = `
        <div class="card">
          <div class="date-header">
            <span class="date-label">${tab === 'today' ? '오늘의 운세' : '내일의 운세'} (${dayData.date || '-'})</span>
            <span class="updated-time">수집: ${updatedAt}</span>
          </div>

          <div class="summary-grid">
            <div class="metric-box">
              <div class="metric-label">운세 총점</div>
              <div class="metric-value">${escapeHtml(String(scoreText))}</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">행운의 색</div>
              <div class="metric-value">
                ${dayData.luckyColor ? `<span class="color-dot" style="background:${colorHex};"></span>` : ''}
                <span>${escapeHtml(String(colorText))}</span>
              </div>
            </div>
          </div>

          <div class="section-title">📜 신한라이프 추출 총평 및 상세 풀이</div>
          ${paragraphsHtml}

          <details class="raw-viewer">
            <summary>수집된 신한라이프 원본 텍스트(rawText) 전체 보기</summary>
            <pre class="raw-pre">${escapeHtml(dayData.rawText || JSON.stringify(dayData, null, 2))}</pre>
          </details>
        </div>

        <a class="direct-link-btn" href="https://www.shinhanlife.co.kr/hp/cdhg0130.do" target="_blank" rel="noopener">
          신한라이프 공식 운세 페이지에서 직접 대조하기 ↗
        </a>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', fetchFortuneJson);
  </script>
</body>
</html>
